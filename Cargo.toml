[package]
name = "cloudready"
version = "0.1.0"
edition = "2024"
build = "src/kernel/build.rs"

[[bin]]
name = "cloudready"
path = "src/kernel/main.rs"

[dependencies]
tiny_http = "0.12.0"
infer = "0.19.0"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
uuid = { version = "1.18", features = ["v4", "serde"] }
