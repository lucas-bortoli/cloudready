name: Release build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: voidzero-dev/setup-vp@v1.21.0
        with:
          node-version: lts
          cache: true
          run-install: true
      - name: Check formatting, linting, and types
        run: vp check
      - name: Test frontend and backend
        run: vp run test

  build:
    name: Build (${{ matrix.name }})
    needs: verify
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            artifact: cloudready-linux
            binary: target/release/cloudready
          - name: Windows
            os: windows-latest
            artifact: cloudready-windows
            binary: target/release/cloudready.exe
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: voidzero-dev/setup-vp@v1.21.0
        with:
          node-version: lts
          cache: true
          run-install: true
      - run: vp run build
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  tag:
    name: Tag release build
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create the commit tag
        id: tag
        shell: bash
        run: |
          tag="v$(date -u +'%Y.%m.%d')-${GITHUB_SHA:0:2}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          existing_sha="$(git ls-remote origin "refs/tags/${tag}^{}" | awk '{print $1}')"
          if [ -n "${existing_sha}" ]; then
            if [ "${existing_sha}" = "${GITHUB_SHA}" ]; then
              echo "Tag ${tag} already exists for this commit."
              exit 0
            fi
            echo "Tag ${tag} already exists for a different commit." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "${tag}" "${GITHUB_SHA}" --message "Release build ${tag}"
          git push origin "${tag}"
      - name: Download release binaries
        uses: actions/download-artifact@v6
        with:
          pattern: cloudready-*
          merge-multiple: true
          path: release-assets
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release upload "${TAG}" release-assets/* --clobber
          else
            gh release create "${TAG}" release-assets/* --title "Release ${TAG}" --generate-notes
          fi
